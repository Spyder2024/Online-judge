services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: online_judge_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_judge_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - judge-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery Broker, Pub/Sub & Caching
  redis:
    image: redis:7-alpine
    container_name: online_judge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - judge-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for Object Storage (Local S3 equivalent)
  minio:
    image: minio/minio
    container_name: online_judge_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - judge-net

  # Node.js Compiler Engine Microservice (AlgoU-Online-Compiler-2)
  compiler-engine:
    build:
      context: ./compiler-engine
      dockerfile: Dockerfile
    container_name: online_judge_compiler_engine
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - judge-net

  # FastAPI Backend API Server
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_judge_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/online_judge_db
      - REDIS_URL=redis://redis:6379/0
      - COMPILER_ENGINE_URL=http://compiler-engine:8000/run
      - ENVIRONMENT=development
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler-engine:
        condition: service_started
    networks:
      - judge-net

  # Celery Execution Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_judge_celery_worker
    command: celery -A app.core.celery_app worker -Q q_compile_exec,q_ai_analysis --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/online_judge_db
      - REDIS_URL=redis://redis:6379/0
      - COMPILER_ENGINE_URL=http://compiler-engine:8000/run
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler-engine:
        condition: service_started
    networks:
      - judge-net

networks:
  judge-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
